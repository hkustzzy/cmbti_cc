<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 猫咪性格测试 CMBTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="paw-print paw-1">🐾</div>
        <div class="paw-print paw-2">🐾</div>
        <div class="paw-print paw-3">🐾</div>
        <div class="paw-print paw-4">🐾</div>
        <div class="paw-print paw-5">🐾</div>
    </div>

    <!-- 欢迎页面 -->
    <div id="welcome-page" class="page active">
        <div class="container">
            <div class="title-section">
                <div class="logo-emoji">😺</div>
                <h1 class="main-title">猫咪性格测试</h1>
                <p class="subtitle">CMBTI · Cat MBTI Personality Test</p>
            </div>

            <div class="welcome-content">
                <div class="cat-emoji">
                    <span class="cat-icon">😸</span>
                    <span class="cat-icon">😻</span>
                    <span class="cat-icon">😽</span>
                </div>
                <p class="welcome-text">想知道你家主子是什么性格吗?</p>
                <p class="welcome-subtext">通过 12 道精心设计的问题<br>揭秘喵星人的真实人设!</p>

                <div class="input-section">
                    <label for="cat-name">
                        <span class="label-icon">✨</span>
                        请输入你家猫咪的名字
                    </label>
                    <input type="text" id="cat-name" placeholder="例如: 团子、布丁、咪咪..." maxlength="20">
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="startTest()">
                        <span class="btn-icon">🐾</span>
                        开始测试
                    </button>
                    <button class="btn-secondary" onclick="showAllPersonalities()">
                        <span class="btn-icon">📖</span>
                        查看所有性格
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 测试页面 -->
    <div id="test-page" class="page">
        <div class="container">
            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">
                    <span class="progress-icon">🐱</span>
                    第 <span class="progress-number">1</span> 题 / 共 12 题
                </div>
            </div>

            <div class="question-card">
                <div class="dimension-badge" id="dimension-title"></div>
                <h3 class="question-text" id="question-text"></h3>

                <div class="options">
                    <button class="option-btn" onclick="selectOption('A')">
                        <span class="option-label">A</span>
                        <span class="option-text" id="option-a"></span>
                        <span class="option-check">✓</span>
                    </button>
                    <button class="option-btn" onclick="selectOption('B')">
                        <span class="option-label">B</span>
                        <span class="option-text" id="option-b"></span>
                        <span class="option-check">✓</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 结果页面 -->
    <div id="result-page" class="page">
        <div class="container">
            <div class="result-content">
                <!-- 分享卡片区域（截图友好） -->
                <div id="share-card" class="share-card">
                    <div class="share-card-slogan">🐱 全网最火的猫咪 MBTI 测试</div>
                    <div class="share-card-image-wrapper">
                        <img id="result-image" class="result-image" src="" alt="猫咪性格图片">
                        <!-- AI 入口按钮：点击直接弹文件选择 -->
                        <button class="btn-ai-entry" id="btn-ai-entry" onclick="triggerAIUpload()">
                            ✨ AI 生成<span id="ai-entry-cat-name"></span>的专属形象 →
                        </button>
                        <input type="file" id="cat-photo-input" accept="image/*" style="display: none;">
                        <!-- AI 加载状态 -->
                        <div class="ai-loading" id="ai-loading" style="display: none;">
                            <div class="ai-spinner"></div>
                            <p class="ai-status-text" id="ai-status-text">AI 正在生成中...</p>
                        </div>
                        <!-- AI 错误状态 -->
                        <div class="ai-error" id="ai-error" style="display: none;">
                            <span class="ai-error-icon">😿</span>
                            <p class="ai-error-message" id="ai-error-message">生成失败</p>
                            <button class="btn-secondary" onclick="retryAI()">重试</button>
                        </div>
                        <!-- AI 结果隐藏元素 -->
                        <img id="ai-result-image" src="" alt="" style="display:none;">
                    </div>
                    <div class="share-card-info">
                        <h2 id="cat-name-display" class="cat-name-display"></h2>
                        <!-- 类型 · 称号 合为一行 -->
                        <div class="personality-headline">
                            <span id="personality-type"></span> · <span id="personality-title"></span>
                        </div>
                        <div class="personality-quote" id="personality-quote"></div>
                        <div class="personality-desc-wrapper">
                            <p class="personality-desc" id="personality-desc"></p>
                        </div>
                    </div>
                    <div class="share-card-footer">
                        <div class="share-card-qr" id="share-qrcode"></div>
                        <div class="share-card-brand">
                            <div class="brand-name">CMBTI</div>
                            <div class="brand-desc">猫咪性格测试</div>
                            <div class="brand-hint">扫码测你家主子</div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-secondary" onclick="restartTest()">
                        <span class="btn-icon">🔄</span>
                        重新测试
                    </button>
                    <button class="btn-primary" onclick="downloadResult()">
                        <span class="btn-icon">📸</span>
                        保存图片
                    </button>
                </div>

                <!-- AI 生成区域已整合到分享卡片中 -->
            </div>
        </div>
    </div>

    <!-- 所有性格页面 -->
    <div id="all-personalities-page" class="page">
        <div class="container-wide">
            <div class="all-header">
                <h1 class="all-title">
                    <span class="title-icon">😺</span>
                    16 种猫咪性格图鉴
                </h1>
                <button class="btn-back" onclick="backToWelcome()">
                    <span class="btn-icon">←</span>
                    返回首页
                </button>
            </div>

            <div class="personalities-grid" id="personalities-grid">
                <!-- 通过 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <!-- 图片保存弹窗 -->
    <div class="save-modal-overlay" id="save-modal" onclick="closeSaveModal(event)">
        <div class="save-modal">
            <div class="save-modal-header">
                <span>长按图片保存到相册</span>
                <button class="save-modal-close" onclick="closeSaveModal()">✕</button>
            </div>
            <div class="save-modal-body">
                <img id="save-modal-image" src="" alt="保存图片">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="replicate-api.js?v=8"></script>
    <script src="script.js?v=7"></script>
</body>
</html>
